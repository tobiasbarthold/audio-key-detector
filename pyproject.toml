[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-key-detector"
version = "0.1.0"
description = "Fast musical key detection for samples and loops (CLI, numpy/scipy only)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "Tobias Barthold" }]
keywords = ["audio", "music", "key detection", "camelot", "chroma"]
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
dependencies = ["numpy>=1.21", "scipy>=1.7", "soundfile>=0.12"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
keydetect = "keydetect.cli:main"

[tool.setuptools]
packages = ["keydetect"]

[tool.pytest.ini_options]
testpaths = ["tests"]
